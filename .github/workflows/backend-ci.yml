name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'docker/Dockerfile.api'
      - 'docker/docker-compose.yml'
      - 'docker/docker-compose.prod.yml'
      - '.dockerignore'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docker/Dockerfile.api'
      - 'docker/docker-compose.yml'
      - 'docker/docker-compose.prod.yml'
      - '.dockerignore'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # MongoDB 8.0 cannot start on the Ubuntu 26.04 kernel (SERVER-136848).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      like-test-mongo:
        image: mongo:8.0@sha256:8e7d23aa641b0ec6c86418866d5d18d74d5abf89061bc5db7bc4b80929021ef6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FEED_LIKE_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Java 설정
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle 설정 및 래퍼 검증
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: 테스트, 포맷 및 패키징 검사
        working-directory: apps/api
        run: ./gradlew test spotlessCheck build --no-daemon

      - name: 테스트 실행 및 생략 여부 검사
        working-directory: apps/api
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites = [ET.parse(path).getroot() for path in Path("build/test-results/test").glob("TEST-*.xml")]
          totals = {key: sum(int(suite.get(key, 0)) for suite in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          print(totals)
          assert totals["tests"] > 0 and not any(totals[key] for key in ("failures", "errors", "skipped")), totals
          PYTEST

      - name: API 이미지 빌드
        run: docker build --file docker/Dockerfile.api --tag kscold-blog-api:ci .

      - name: API 이미지 실행 권한 검사
        run: |
          docker run --rm --entrypoint java kscold-blog-api:ci -version
          test "$(docker image inspect kscold-blog-api:ci --format '{{.Config.User}}')" = blog-api
          test "$(docker run --rm --entrypoint id kscold-blog-api:ci -u)" = 10001
          test "$(docker image inspect kscold-blog-api:ci --format '{{if .Config.Healthcheck}}yes{{end}}')" = yes

      - name: API 이미지 전체 취약점 수집
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: kscold-blog-api:ci
          scanners: vuln
          format: json
          output: backend-security.json
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          cache: false

      - name: 수정 가능한 이미지 취약점 검사
        run: |
          python3 - <<'PYAUDIT'
          import json
          from collections import Counter
          from pathlib import Path
          report = json.loads(Path("backend-security.json").read_text())
          vulnerabilities = [item for result in report.get("Results", []) for item in result.get("Vulnerabilities", [])]
          print("전체 취약점:", dict(Counter(item["Severity"] for item in vulnerabilities)))
          fixable = [item for item in vulnerabilities if item.get("FixedVersion")]
          for item in fixable:
              print(item["VulnerabilityID"], item["PkgName"], item["InstalledVersion"], "->", item["FixedVersion"])
          assert not fixable, f"수정 가능한 취약점 {len(fixable)}건"
          PYAUDIT

      - name: 이미지 보안 검사 결과 보관
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-security
          path: backend-security.json
          retention-days: 7
