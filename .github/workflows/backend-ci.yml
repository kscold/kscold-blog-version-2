name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'docker/Dockerfile.api'
      - '.dockerignore'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docker/Dockerfile.api'
      - '.dockerignore'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      like-test-mongo:
        image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FEED_LIKE_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Java 설정
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 설정 및 래퍼 검증
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: 테스트, 포맷 및 패키징 검사
        working-directory: apps/api
        run: ./gradlew test spotlessCheck bootJar --no-daemon

      - name: API 이미지 빌드
        run: docker build --file docker/Dockerfile.api --tag kscold-blog-api:ci .

      - name: API 이미지 실행 권한 검사
        run: |
          test "$(docker image inspect kscold-blog-api:ci --format '{{.Config.User}}')" = blog-api
          test "$(docker run --rm --entrypoint id kscold-blog-api:ci -u)" = 10001
          test "$(docker image inspect kscold-blog-api:ci --format '{{if .Config.Healthcheck}}yes{{end}}')" = yes

      - name: API 이미지 보안 검사
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kscold-blog-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
