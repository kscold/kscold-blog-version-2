name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - 'docker/Dockerfile.web'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - 'docker/Dockerfile.web'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      API_INTERNAL_URL: http://127.0.0.1:4100/api
      NEXT_PUBLIC_API_URL: ''
      # 강사 발표 화면은 실제 대본 대신 시험용 가짜 대본을 읽는다(apps/web 기준 경로).
      HANSALIM_PRESENTER_DIR: e2e/fixtures/hansalim-presenter
      SEARCH_INSIGHTS_DIR: e2e/fixtures/search-insights/config
      SEARCH_INSIGHTS_STATE_DIR: e2e/fixtures/search-insights/state
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm 설정
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Node.js 설정
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 린트 검사
        run: pnpm --dir apps/web lint

      - name: 타입 검사
        run: pnpm --dir apps/web type-check

      - name: 전체 의존성 보안 검사
        run: pnpm audit --audit-level low

      - name: 운영 빌드 검사
        run: |
          node apps/web/e2e/support/build-api-stub.mjs &
          stub_pid=$!
          trap 'kill "${stub_pid}"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4100/api/health >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              exit 1
            fi
            sleep 0.25
          done
          pnpm --dir apps/web build

      - name: Playwright 브라우저 설정
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: 브라우저 E2E 검사
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3101
        run: |
          node apps/web/e2e/support/build-api-stub.mjs &
          stub_pid=$!
          pnpm --dir apps/web exec next start --hostname 127.0.0.1 -p 3102 &
          web_pid=$!
          node apps/web/e2e/support/ci-web-proxy.mjs &
          proxy_pid=$!
          trap 'kill "${proxy_pid}" "${web_pid}" "${stub_pid}"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3101/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3101/ >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              exit 1
            fi
            sleep 0.25
          done
          pnpm --dir apps/web exec playwright test
          test "$(curl --fail --silent http://127.0.0.1:4100/__request-count)" -gt 0

      - name: 빈 블로그 아카이브 검사
        env:
          BUILD_BLOG_EMPTY: 'true'
        run: pnpm --dir apps/web test:e2e:ci --grep '빈 첫 아카이브'

      - name: 실패한 브라우저 검사 자료 보관
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-failure-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3
