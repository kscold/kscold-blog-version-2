# 백엔드·프런트엔드는 ubuntu-blog 컨테이너에 배포하며, 이 스택은 Agent와 Qdrant만 관리합니다.
services:
  blog-agent:
    container_name: kscold-vault-agent
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - OPENAI_WEB_SEARCH_MODEL=${OPENAI_WEB_SEARCH_MODEL:-gpt-5-search-api}
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI is required}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-kscold-blog}
      - QDRANT_URL=http://blog-qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-vault_notes}
      - VAULT_AGENT_GRPC_PORT=9090
      - VAULT_AGENT_MAX_CONTEXT_NOTES=${VAULT_AGENT_MAX_CONTEXT_NOTES:-5}
      - VAULT_AGENT_WEB_SEARCH_ENABLED=${VAULT_AGENT_WEB_SEARCH_ENABLED:-true}
      - VAULT_AGENT_INDEX_SYNC_INTERVAL_SECONDS=${VAULT_AGENT_INDEX_SYNC_INTERVAL_SECONDS:-900}
    depends_on:
      - blog-qdrant
    networks:
      - kscold-control_default
    restart: unless-stopped

  blog-qdrant:
    container_name: kscold-vault-qdrant
    image: qdrant/qdrant:v1.19.0-unprivileged
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - blog-qdrant-data:/qdrant/storage
      - blog-qdrant-snapshots:/qdrant/snapshots
    networks:
      - kscold-control_default
    restart: unless-stopped

networks:
  kscold-control_default:
    external: true

volumes:
  blog-qdrant-data:
    external: true
    name: kscold-vault-qdrant-data
  blog-qdrant-snapshots:
    external: true
    name: kscold-vault-qdrant-snapshots
