packages:
  - 'apps/*'
  - 'packages/*'

# macOS에서 만든 standalone 산출물을 Linux ARM64 운영 컨테이너에서도 실행한다.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc

# pnpm 11+에서는 루트 package.json의 pnpm 설정을 읽지 않는다.
overrides:
  "@humanfs/node": "0.16.8"
  "@tiptap/core": "3.32.0"
  "@tiptap/pm": "3.32.0"
  "ajv@6": "6.15.0"
  "brace-expansion@1": "1.1.21"
  "browserslist": "4.28.9"
  "caniuse-lite": "1.0.30001810"
  "dompurify": "3.4.17"
  "flatted": "3.4.4"
  "follow-redirects": "1.16.1"
  "joi": "18.3.0"
  "katex": "0.19.1"
  "js-yaml@3": "3.15.2"
  "js-yaml@4": "4.3.2"
  "linkify-it": "5.0.2"
  "lodash-es": "4.18.1"
  "markdown-it": "14.3.3"
  "minimatch@3": "3.1.5"
  "nanoid@3": "3.3.18"
  "picomatch@2": "2.3.2"
  "picomatch@4": "4.0.4"
  "pdfjs-dist": "6.4.299"
  "postcss": "8.5.28"
  "postcss-selector-parser@6": "6.1.5"
  "prismjs": "1.30.0"
  "socket.io-parser": "4.2.7"
  "source-map-js": "1.2.2"

# 설치 시 실행할 네이티브 의존성 스크립트를 명시한다.
allowBuilds:
  unrs-resolver: true
