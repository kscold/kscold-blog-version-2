packages:
  - 'apps/*'
  - 'packages/*'

# macOS에서 만든 standalone 산출물을 Linux ARM64 운영 컨테이너에서도 실행한다.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc

# pnpm 11+에서는 루트 package.json의 pnpm 설정을 읽지 않는다.
overrides:
  "@ungap/structured-clone": "1.4.0"
  "@humanfs/node": "0.16.8"
  "@tiptap/core": "3.32.0"
  "@tiptap/pm": "3.32.0"
  "ajv@6": "6.15.0"
  "brace-expansion@1": "1.1.21"
  "browserslist": "4.28.9"
  "caniuse-lite": "1.0.30001810"
  "dompurify": "3.4.17"
  "flatted": "3.4.4"
  "follow-redirects": "1.16.2"
  "joi": "18.3.1"
  "katex": "0.19.1"
  "js-yaml@3": "3.15.2"
  "js-yaml@4": "4.3.2"
  "linkify-it": "5.0.2"
  "lodash-es": "4.18.1"
  "markdown-it": "14.3.3"
  "minimatch@3": "3.1.5"
  "minimatch@10": "11.0.3"
  "nanoid@3": "3.3.18"
  "picomatch@2": "2.3.2"
  "picomatch@4": "4.0.4"
  "pdfjs-dist": "6.4.299"
  "postcss": "8.5.32"
  "postcss-selector-parser@6": "6.1.5"
  "prismjs": "1.30.0"
  "socket.io-parser": "4.2.7"
  "source-map-js": "1.2.2"

# minimatch 권고(GHSA-g3hv-75wg-m249)는 11.0.1부터만 고쳐졌고 3.x 수정본이 없다.
# 3.x는 eslint-config-next가 끌어오는 린트 플러그인(import·jsx-a11y·react)만 쓰고 패턴도 저장소 설정 값뿐이라
# 외부 입력이 닿지 않으므로, 플러그인이 11.x로 올라올 때까지 이 권고만 예외로 둔다. 10.x는 위 overrides로 11.x에 맞췄다.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249

# 설치 시 실행할 네이티브 의존성 스크립트를 명시한다.
allowBuilds:
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.105.0"
  - "@tanstack/query-devtools@5.105.0"
  - "@tanstack/react-query-devtools@5.105.0"
  - "@tanstack/react-query@5.105.0"
  - postcss@8.5.32
  - "@aws-sdk/checksums@3.1001.6"
  - "@aws-sdk/client-s3@3.1157.0"
  - "@aws-sdk/core@3.978.6"
  - "@aws-sdk/credential-provider-env@3.972.77"
  - "@aws-sdk/credential-provider-http@3.972.79"
  - "@aws-sdk/credential-provider-ini@3.973.22"
  - "@aws-sdk/credential-provider-login@3.972.84"
  - "@aws-sdk/credential-provider-node@3.972.89"
  - "@aws-sdk/credential-provider-process@3.972.77"
  - "@aws-sdk/credential-provider-sso@3.973.21"
  - "@aws-sdk/credential-provider-web-identity@3.972.83"
  - "@aws-sdk/middleware-sdk-s3@3.972.82"
  - "@aws-sdk/nested-clients@3.997.51"
  - "@aws-sdk/token-providers@3.1157.0"
  - "@smithy/core@3.37.0"
  - "@smithy/node-http-handler@4.13.0"
  - axios@1.21.0
