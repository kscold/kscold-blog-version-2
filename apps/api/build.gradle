plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.10.0'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.kscold'
version = '2.0.0'

ext {
    // JWT·디스코드 라이브러리가 쓰는 Jackson 2를 보안 수정 버전(CVE-2026-89407·89425·91776·91777)으로 맞춘다.
    // 애플리케이션 코드와 스프링은 Jackson 3를 쓰며, 그 버전은 Spring Boot가 관리한다.
    set('jackson-2-bom.version', '2.21.7')
    grpcVersion = '1.84.0'
    protobufVersion = '3.25.9'
}

java {
    sourceCompatibility = '21'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // AWS S3 SDK (MinIO S3 호환)
    implementation 'software.amazon.awssdk:s3:2.54.10'

    // Jsoup (HTML 파싱 / OG 메타데이터 스크래핑)
    implementation 'org.jsoup:jsoup:1.23.2'

    // 외부 API 응답의 TTL·용량 제한 캐시
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Discord JDA (채팅 브릿지)
    implementation 'net.dv8tion:JDA:5.6.1'

    // gRPC (Vault Agent bridge)
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Dev Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jackson-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

tasks.register('prepareIde') {
    group = 'IDE'
    description = 'IDE에서 gRPC 생성 소스와 Java 컴파일 정보를 최신화합니다.'
    dependsOn tasks.named('compileJava')
}
