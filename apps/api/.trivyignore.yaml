# API 이미지 보안 검사(Trivy) 예외 목록.
# 예외는 공개 수정 버전을 적용할 수 없고, 취약한 기능을 쓰지 않아 영향이 없다는 근거가 있을 때만 만료일과 함께 적는다.
# 만료일이 지나면 검사가 다시 실패하므로 그때 근거를 다시 확인한다.
vulnerabilities:
  - id: CVE-2026-47884
    purls:
      - pkg:maven/org.springframework/spring-webmvc@6.2.19
    expired_at: 2026-12-31
    statement: >-
      XsltView 를 쓰고 "/**" 매핑이 뷰 이름 없이 뷰 렌더링으로 이어질 때만 성립하는 취약점이다.
      이 API 는 @RestController 만 쓰며 XsltView 와 뷰 리졸버가 없어 해당하지 않는다
      (SecurityExceptionGuardTest 가 빌드에서 검증한다).
      6.2.x 수정본(6.2.20)은 유료 지원 전용이고 공개 수정본은 7.0.9 뿐이라,
      Spring Boot 4 로 올릴 때 이 예외를 지운다.
